// ── Calendar Date Picker ──────────────────────────────────────────────────────
function CalendarPicker({ value, onChange }) {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const today = new Date();

  // Parse existing value or default to a sensible starting point
  const parsed = value ? new Date(value + "T12:00:00") : null;
  const [viewYear, setViewYear] = useState(parsed ? parsed.getFullYear() : 1970);
  const [viewMonth, setViewMonth] = useState(parsed ? parsed.getMonth() : 0);
  const [open, setOpen] = useState(false);

  const selected = parsed;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();

  const years = [];
  for (let y = 1930; y <= today.getFullYear(); y++) years.push(y);

  const select = (day) => {
    const mm = String(viewMonth + 1).padStart(2, "0");
    const dd = String(day).padStart(2, "0");
    onChange(`${viewYear}-${mm}-${dd}`);
    setOpen(false);
  };

  const isSelected = (day) => selected && selected.getFullYear() === viewYear && selected.getMonth() === viewMonth && selected.getDate() === day;

  const displayValue = selected
    ? `${MONTHS[selected.getMonth()]} ${selected.getDate()}, ${selected.getFullYear()}`
    : "";

  return (
    React.createElement('div', { style: { position:"relative" },}
      /* Trigger button */
      , React.createElement('div', { onClick: () => setOpen(o => !o), style: { display:"flex", alignItems:"center", gap:10, padding:"9px 12px", border:`1.5px solid ${open ? C.gold : C.border}`, borderRadius:4, background:C.card, cursor:"pointer", fontFamily:"Crimson Text,serif", fontSize:15, color:displayValue ? C.textDark : C.muted, userSelect:"none" },}
        , React.createElement('span', { style: { fontSize:16 },}, "📅")
        , React.createElement('span', null, displayValue || "Select date")
        , displayValue && (
          React.createElement('span', { onClick: e => { e.stopPropagation(); onChange(""); }, style: { marginLeft:"auto", color:C.muted, fontSize:16, lineHeight:1, cursor:"pointer" },}, "×")
        )
      )

      /* Calendar dropdown */
      , open && (
        React.createElement('div', { style: { position:"absolute", top:"calc(100% + 6px)", left:0, zIndex:999, background:"#fff", border:`1.5px solid ${C.goldLight}`, borderRadius:8, boxShadow:"0 8px 32px rgba(44,24,16,0.18)", padding:16, width:300 },}
          /* Month + Year selectors */
          , React.createElement('div', { style: { display:"flex", alignItems:"center", gap:6, marginBottom:12 },}
            , React.createElement('button', { onClick: () => { if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y-1); } else setViewMonth(m => m-1); },
              style: { background:"none", border:`1px solid ${C.goldLight}`, borderRadius:4, width:28, height:28, cursor:"pointer", color:C.gold, fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" },}, "‹")
            , React.createElement('select', { value: viewMonth, onChange: e => setViewMonth(+e.target.value),
              style: { flex:1, padding:"4px 6px", border:`1px solid ${C.goldLight}`, borderRadius:4, fontFamily:"Crimson Text,serif", fontSize:14, color:C.textDark, background:"#fff", cursor:"pointer" },}
              , MONTHS.map((m,i) => React.createElement('option', { key: i, value: i,}, m))
            )
            , React.createElement('select', { value: viewYear, onChange: e => setViewYear(+e.target.value),
              style: { flex:1, padding:"4px 6px", border:`1px solid ${C.goldLight}`, borderRadius:4, fontFamily:"Crimson Text,serif", fontSize:14, color:C.textDark, background:"#fff", cursor:"pointer" },}
              , years.map(y => React.createElement('option', { key: y, value: y,}, y))
            )
            , React.createElement('button', { onClick: () => { if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y+1); } else setViewMonth(m => m+1); },
